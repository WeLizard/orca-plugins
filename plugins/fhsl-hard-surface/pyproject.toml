[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filamenthub-surface-hard-surface"
version = "1.0.2"
description = "Hard Surface height maps for OrcaSlicer"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["fhslh"]
include-package-data = true

[tool.setuptools.package-data]
fhslh = ["t/*.png"]

[tool.fhsl]
plugin-id = "filamenthub_surface_hard_surface"
import-name = "fhslh"
texture-count = 53
